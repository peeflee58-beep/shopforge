<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SHOPFORGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body>

<header class="products-header">
    <a href="index.html" class="logo">
        <span class="logo-icon"><i class="bi bi-bag-check-fill"></i></span>
        SHOPFORGE
    </a>
    <nav class="header-links">
        <a href="products.html">Catalogue</a>
        <a href="login.html">Sign In</a>
    </nav>
</header>

<main style="display: grid; place-items: center; min-height: 80vh; padding: 30px 20px;">
    <div style="width: 100%; max-width: 440px; background: linear-gradient(150deg, #0d172b, #080f20); border: 1px solid var(--border); padding: 35px; border-radius: 17px;">
        <span class="eyebrow">GET STARTED</span>
        <h2 style="font-size: 26px; margin: 8px 0 20px;">Create an account</h2>

        <form id="signupForm" style="display: grid; gap: 16px;">
            <div>
                <label style="display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px;">I want to join as a:</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button type="button" class="role-btn active" data-role="buyer" style="padding: 10px; border-radius: 9px; border: 1px solid rgba(96, 165, 250, 0.5); background: rgba(59, 130, 246, 0.15); color: white; font-size: 12px; font-weight: 600;">Buyer</button>
                    <button type="button" class="role-btn" data-role="seller" style="padding: 10px; border-radius: 9px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;">Seller</button>
                </div>
            </div>

            <div>
                <label style="display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px;">Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe" style="width: 100%; padding: 11px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 9px; color: white; outline: none;">
            </div>

            <div>
                <label style="display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px;">Email Address</label>
                <input type="email" id="signupEmail" required placeholder="name@example.com" style="width: 100%; padding: 11px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 9px; color: white; outline: none;">
            </div>

            <div>
                <label style="display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px;">Password</label>
                <input type="password" id="signupPassword" required placeholder="••••••••" style="width: 100%; padding: 11px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 9px; color: white; outline: none;">
            </div>

            <button type="submit" id="signupBtn" class="checkout-btn" style="margin-top: 8px;">
                Create Account <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <p style="text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px;">
            Already have an account? <a href="login.html" style="color: #60a5fa; font-weight: 500;">Sign in</a>
        </p>
    </div>
</main>

<script type="module" src="java/signup.js"></script>
</body>
</html>
