<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SHOPFORGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/product.css">
</head>
<body>

<header class="products-header">
    <a href="index.html" class="logo">
        <span class="logo-icon"><i class="bi bi-bag-check-fill"></i></span>
        SHOPFORGE
    </a>
    <nav class="header-links">
        <a href="products.html">Catalogue</a>
        <a href="index.html">Home</a>
    </nav>
</header>

<main style="display: grid; place-items: center; min-height: 80vh; padding: 30px 20px;">
    <div style="width: 100%; max-width: 420px; background: linear-gradient(150deg, #0d172b, #080f20); border: 1px solid var(--border); padding: 35px; border-radius: 17px;">
        <span class="eyebrow">WELCOME BACK</span>
        <h2 style="font-size: 26px; margin: 8px 0 25px;">Sign in to your account</h2>

        <form id="loginForm" style="display: grid; gap: 18px;">
            <div>
                <label style="display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px;">Email Address</label>
                <input type="email" id="sellerEmail" required placeholder="name@example.com" style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 9px; color: white; outline: none;">
            </div>
            <div>
                <label style="display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px;">Password</label>
                <input type="password" id="sellerPassword" required placeholder="••••••••" style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 9px; color: white; outline: none;">
            </div>
            <button type="submit" id="loginBtn" class="checkout-btn" style="margin-top: 10px;">
                Sign In <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <p style="text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px;">
            Don't have an account? <a href="signup.html" style="color: #60a5fa; font-weight: 500;">Create account</a>
        </p>
    </div>
</main>

<script type="module" src="../java/login.js"></script>
</body>
</html>
